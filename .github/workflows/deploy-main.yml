name: Deploy Main Branch to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_MAIN_HOST_IP }}
          username: github_user
          key: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/github_user/workspace/mini-rag

            git checkout main
            git pull --ff-only origin main

            cd docker

            docker compose config -q
            docker compose up -d --build --remove-orphans

            test -s /etc/letsencrypt/live/hakaa.publicvm.com/fullchain.pem &&
            test -s /etc/letsencrypt/live/hakaa.publicvm.com/privkey.pem &&
            test -s /etc/nginx/.htpasswd

            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload

            echo "Waiting for HTTPS API..."

            for i in $(seq 1 24); do
              if curl -fsS https://hakaa.publicvm.com/api/v1/ >/dev/null; then
                echo "Deployment successful: HTTPS API is healthy"
                exit 0
              fi

              echo "API not ready yet; retrying..."
              sleep 5
            done

            echo "Deployment failed: HTTPS API is unhealthy"
            docker compose ps
            docker compose logs --tail=100 nginx fastapi
            exit 1